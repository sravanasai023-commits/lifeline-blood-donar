{% extends "base.html" %}

{% block content %}

<section class="form-container">

    <div class="form-box">

        <h2>Login</h2>

        <form method="POST">

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <div class="remember">
                <input type="checkbox">
                Remember Me
            </div>

            <button type="submit" class="btn">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="/signup">Sign Up</a>
        </p>

    </div>

</section>

{% endblock %}
