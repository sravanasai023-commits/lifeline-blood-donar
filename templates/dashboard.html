{% extends "base.html" %}

{% block content %}

<section class="dashboard">

<h1>Welcome to LifeLink Dashboard</h1>

<div class="dashboard-cards">

<div class="dashboard-card">
<h2>{{ donors }}</h2>
<p>Total Donors</p>
</div>

<div class="dashboard-card">
<h2>{{ requests }}</h2>
<p>Blood Requests</p>
</div>

<div class="dashboard-card">
<h2>24/7</h2>
<p>Emergency Support</p>
</div>

<div class="dashboard-card">
<h2>8</h2>
<p>Blood Groups</p>
</div>

</div>

<div class="dashboard-actions">

<a href="/register" class="btn">Register Donor</a>

<a href="/find_blood" class="btn btn-outline">Find Blood</a>

<a href="/emergency" class="btn">Emergency Request</a>

</div>

</section>

{% endblock %}
