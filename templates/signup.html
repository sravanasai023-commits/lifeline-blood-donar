{% extends "base.html" %}

{% block content %}

<section class="form-container">

    <div class="form-box">

        <h2>Create Account</h2>

        <form action="/signup" method="POST">

            <input type="text"
                   name="name"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <input type="password"
                   name="confirm_password"
                   placeholder="Confirm Password"
                   required>

            <select name="blood_group" required>
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <input type="text"
                   name="city"
                   placeholder="City"
                   required>

            <button type="submit" class="btn">
                Sign Up
            </button>

        </form>

        <p style="text-align:center; margin-top:15px;">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</section>

{% endblock %}
